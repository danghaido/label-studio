        <Header value="Xem PDF (dùng nút mở / đóng thumbnail trong thanh công cụ)"/>
        <Pdf name="document" value="$image"/>
      </View>
      <View style="width:42%; min-width:0; height:calc(100vh - 185px); overflow-y:auto; padding:12px; box-sizing:border-box; background:#ffffff; border:1px solid #e2e8f0; border-radius:12px;">
        <Header value="Chọn loại tài liệu"/>
