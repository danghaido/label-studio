title: OCR ground truth
type: community
group: Computer Vision
order: 1
image: /static/templates/pdf-classification.png
details: |
  <h1>Gán nhãn Ground Truth OCR</h1>
  <p>Xem tài liệu PDF bên trái, chọn một trong 12 loại tài liệu tiếng Việt và nhập Ground Truth bên phải.</p>
  <p>Hỗ trợ bảng nhập liệu theo schema cho chi phí, hóa đơn và đơn thuốc. Sử dụng trường dữ liệu image làm URL tài liệu PDF.</p>
config: |
  <View>
