          <Choice value="claim_form" html="Giấy yêu cầu bồi thường"/>
          <Choice value="medical_report" html="Báo cáo y tế"/>
          <Choice value="vat_invoice" html="Hóa đơn giá trị gia tăng"/>
          <Choice value="claimant_expense_statement" html="Bảng kê chi phí (Bệnh nhân tự lập)"/>
